# Dify Helm Chart Values for AKS
# Using dify-helm from https://borispolonsky.github.io/dify-helm
# Configured for Azure Kubernetes Service
#
# Single Standard_D2s_v5 (2 vCPU), 1900m/5929Mi allocatable, of which AKS system
# pods already hold ~977m/~994Mi.
#
# CPU limits are removed deliberately, so a CPU request is only a scheduling
# reservation plus a proportional-share weight under saturation -- it never caps a
# pod at runtime. Measured draw across the whole namespace was 79m against 775m
# reserved, so the requests below are sized down to ~500m to leave room for the
# node-level monitoring agent without changing what any pod can actually use.
#
# Memory is the opposite: it is incompressible, and a pod above its request is the
# first thing kubelet evicts under node pressure. Every memory request below is
# therefore set at or above measured steady state, which moves worker, beat and
# pluginDaemon *up*. Memory limits are unchanged and remain the real protection
# against a runaway pod.
#
# Figures annotated "measured" came from `kubectl top pods -n dify` on the dev
# cluster. Re-measure before trimming further, and note these are idle-ish
# readings -- memory is what grows under load, not CPU.

# Secrets (appSecretKey, postgres, redis, qdrant) are set by deploy.sh from TF_VAR_* or terraform.tfvars — not stored here
global:
  edition: "SELF_HOSTED"
  appSecretKey: "override-by-deploy-script"  # deploy.sh passes via --set-file from TF_VAR_dify_secret_key or dify_secret_key
  internalApiKey: ""

# Image versions — pairing from langgenius/dify@1.14.2 docker-compose.yaml.
# Move as a set: plugin daemon must match the API or plugin endpoints 404.
image:
  api:
    repository: langgenius/dify-api
    tag: "1.14.2"
    pullPolicy: IfNotPresent
  web:
    repository: langgenius/dify-web
    tag: "1.14.2"
    pullPolicy: IfNotPresent
  sandbox:
    repository: langgenius/dify-sandbox
    tag: "0.2.15"
    pullPolicy: IfNotPresent
  proxy:
    repository: nginx
    # Digest captured from the healthy dev release on 2026-08-03. Pinning keeps
    # replacement AKS nodes from silently pulling a different `latest` image.
    tag: "latest@sha256:ec4ed8b5299e5e90694af7750eb6dffd2627317d30544d056b0371f8082f7bce"
    pullPolicy: IfNotPresent
  ssrfProxy:
    repository: ubuntu/squid
    tag: "latest@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029"
    pullPolicy: IfNotPresent
  pluginDaemon:
    repository: langgenius/dify-plugin-daemon
    tag: "0.6.1-local"
    pullPolicy: IfNotPresent

# Rolling updates on this single 2 vCPU node could not fit a new pod alongside the
# old one -- the node sat at 93% of allocatable CPU requests, so the default
# maxSurge=1 left the replacement pod Pending forever and the Helm upgrade timed
# out. Every Dify workload below therefore terminates its old pod before creating
# the new one. Each is a single replica anyway, so surge bought nothing; the cost
# is a short gap per component during a deploy.
#
# The CPU trim above takes the node to roughly 79% of allocatable requests, which
# is finally more headroom than the largest single pod request. These overrides can
# therefore be removed -- but do that as its own change, once the trim has been
# observed to hold, rather than bundling it in here.

# API Configuration
# CPU share: requests only, no CPU limit. 100m request for scheduling.
api:
  enabled: true
  replicas: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "2Gi"
  persistence:
    enabled: true
    persistentVolumeClaim:
      storageClass: "azurefile"
      accessModes: ReadWriteMany
      size: 5Gi

  # API request concurrency.
  # These API calls are I/O-bound (they spend almost all their time waiting on
  # the LLM provider), and Dify runs gunicorn with the gevent worker class, so a
  # single worker process can serve many concurrent requests cheaply as green
  # threads. The image default is 1 worker x 10 connections = ~10 concurrent,
  # which caused 504s once more than ~10 parallel requests were in flight.
  # On the small dev node we keep 1 worker (each worker is a full process,
  # ~300-500Mi) and only raise connections. Prod overrides these via
  # values-prod.yaml (more workers + replicas).
  extraEnv:
    - name: SERVER_WORKER_CLASS
      value: "gevent"
    - name: SERVER_WORKER_AMOUNT
      value: "1"
    - name: SERVER_WORKER_CONNECTIONS
      value: "25"

  # OpenTelemetry export to self-hosted Arize Phoenix.
  # Defaults off; enabled and pointed at the right Phoenix per environment by
  # deploy.sh when PHOENIX_OTLP_ENDPOINT is set (sourced from a GitHub
  # Environment variable in CI, or your local shell).
  #
  # These spans are generic OTEL (HTTP/DB/Celery) -- they do NOT replace the
  # per-app Dify -> Arize/OpenInference integration configured in the Dify UI,
  # which is what produces LLM/chain/retriever spans with input/output.
  otel:
    enabled: false
    baseEndpoint: ""
    exporterProtocol: "http/protobuf"
    exporterType: "otlp"
    samplingRate: 1.0
    batchExportScheduleDelay: 5000
    maxQueueSize: 2048
    maxExportBatchSize: 512
    metricExportInterval: 60000
    batchExportTimeout: 10000
    metricExportTimeout: 30000

# Worker Configuration
# CPU share: requests only. 100m request for scheduling.
worker:
  enabled: true
  replicas: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  resources:
    requests:
      memory: "448Mi"   # measured 360Mi, above the previous 256Mi request
      cpu: "100m"
    limits:
      memory: "1Gi"

# Worker Beat Configuration
# CPU share: no CPU limit. Beat only emits periodic tasks, so it needs almost no
# CPU (measured 1m). Its memory request goes the other way: measured 333Mi against
# the previous 256Mi request made it the first candidate for eviction.
beat:
  enabled: true
  replicas: 1
  # No updateStrategy override: the chart sets Recreate, which a singleton
  # scheduler needs. Two beats at once would double every periodic task.
  resources:
    requests:
      memory: "448Mi"   # measured 333Mi
      cpu: "25m"
    limits:
      memory: "512Mi"

# Web (Frontend) Configuration
# CPU share: no CPU limit.
web:
  enabled: true
  replicas: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  resources:
    requests:
      memory: "384Mi"   # measured 243Mi
      cpu: "100m"
    limits:
      memory: "2Gi"

# Sandbox Configuration
# CPU share: no CPU limit.
sandbox:
  enabled: true
  replicas: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  auth:
    apiKey: "dify-sandbox"
  resources:
    requests:
      memory: "192Mi"   # measured 109Mi
      cpu: "50m"
    limits:
      memory: "1Gi"

# SSRF Proxy Configuration
# CPU share: no CPU limit.
ssrfProxy:
  enabled: true
  replicas: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  resources:
    requests:
      memory: "128Mi"   # measured 19Mi
      cpu: "25m"
    limits:
      memory: "512Mi"

# Plugin Daemon Configuration
# CPU share: no CPU limit; measured 3m idle.
# This is the largest memory consumer in the namespace and it grows with every
# installed plugin -- measured 679Mi against a 512Mi request, so the request is
# raised rather than trimmed. Watch this one as plugins are added.
pluginDaemon:
  enabled: true
  replicas: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  auth:
    serverKey: "lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi"
    difyApiKey: "QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1"
  extraEnv:
    - name: DB_SSL_MODE
      value: "disable"  # Required by plugin-daemon (oneof=disable require); set "require" when enabling SSL
  resources:
    requests:
      memory: "768Mi"   # measured 679Mi
      cpu: "50m"
    limits:
      memory: "2048Mi"
  persistence:
    enabled: true
    persistentVolumeClaim:
      storageClass: "azurefile"
      accessModes: ReadWriteMany
      size: 20Gi

# Proxy (Nginx) Configuration
# CPU share: no CPU limit.
proxy:
  enabled: true
  replicas: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "25m"
    limits:
      memory: "256Mi"

# Service Configuration - Use ClusterIP (Ingress handles external access)
service:
  type: ClusterIP  # Changed from LoadBalancer
  port: 80

# Ingress Configuration - Enable and configure
# Host is overridden by deploy.sh from project_name in terraform.tfvars:
#   prod (lite or full) -> dify-prod; dev -> dify-dev; UAT -> dify-uat
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # Use "letsencrypt-staging" for testing
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    # Long-running LLM/workflow requests (e.g. /v1/chat-messages in blocking or
    # streaming mode) can exceed ingress-nginx's default 60s timeouts and return
    # 504. Raise read/send timeouts to 1h to match the Dify internal proxy.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "75"
  hosts:
    - host: dify-dev.tichealth.com.au  # default; overridden by deploy.sh for Prod/UAT
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: dify-tls
      hosts:
        - dify-dev.tichealth.com.au

# PostgreSQL Configuration - Using Azure PostgreSQL Flexible Server (external)
# password: set by deploy.sh from TF_VAR_postgresql_password (CI) or terraform.tfvars (local) — not stored here
# address: set by deploy.sh from `terraform output postgresql_fqdn` when using Azure Postgres
postgresql:
  enabled: false  # Disable in-cluster PostgreSQL

externalPostgres:
  enabled: true
  username: "difyadmin"
  password: "override-by-deploy-script"  # deploy.sh passes real value via --set-file from TF_VAR or terraform.tfvars
  address: "override-by-deploy-script"
  port: 5432
  database:
    api: "dify"  # Main Dify database
    pluginDaemon: "dify_plugin"  # Plugin daemon database (created by Terraform)

# Redis Configuration (using Bitnami subchart)
# password: set by deploy.sh from TF_VAR_redis_password or redis_password in terraform.tfvars
redis:
  enabled: true
  auth:
    password: "override-by-deploy-script"
  master:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        memory: "256Mi"   # measured 210Mi; do not trim, it sits close to the request
        cpu: "25m"
      limits:
        memory: "512Mi"
  replica:
    replicaCount: 0  # Disable replicas for now

# Weaviate disabled (we'll use Qdrant)
weaviate:
  enabled: false

# External Qdrant Configuration
# apiKey: set by deploy.sh from TF_VAR_qdrant_api_key or qdrant_api_key in terraform.tfvars
externalQdrant:
  enabled: true
  endpoint: "http://dify-qdrant:6333"
  apiKey: "override-by-deploy-script"

# Storage Configuration (using local persistence for now)
externalS3:
  enabled: false

# External Secrets (disabled for now)
externalSecret:
  enabled: false
