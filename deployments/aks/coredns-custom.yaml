apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  # AKS imports *.server entries without replacing its managed Corefile. Forward
  # Azure PostgreSQL names to Azure DNS so private-link zones remain resolvable.
  postgres.server: |
    postgres.database.azure.com:53 {
        errors
        cache 30
        forward . 168.63.129.16
    }
